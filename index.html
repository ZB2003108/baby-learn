<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>宝贝学习乐园 · 4岁启蒙工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>
:root{
  --pink:#FF93B3;  --pink-l:#FFE6EE;
  --blue:#74C7F5;  --blue-l:#E2F3FF;
  --yellow:#FFD259;--yellow-l:#FFF5D9;
  --green:#7FDFA0; --green-l:#E3FBEB;
  --purple:#BFA4F7;--purple-l:#F1EAFF;
  --ink:#4B3A5C; --ink2:#6E5C80; --muted:#9A89AB;
  --bg:#FFFBF7; --card:#FFFFFF; --line:#F1E5F3;
  --shadow:0 10px 26px rgba(150,115,175,.13);
  --shadow-soft:0 3px 0 rgba(196,176,214,.20);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--bg);min-height:100vh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none!important}
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-blobs span{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5}
.bg-blobs span:nth-child(1){width:320px;height:320px;background:#FFD9E7;top:-90px;left:-80px}
.bg-blobs span:nth-child(2){width:280px;height:280px;background:#D9EEFF;top:22%;right:-100px}
.bg-blobs span:nth-child(3){width:300px;height:300px;background:#FFF0C8;bottom:-110px;left:26%}
.bg-blobs span:nth-child(4){width:240px;height:240px;background:#E7DEFF;bottom:16%;right:16%}
.bg-blobs span:nth-child(5){width:220px;height:220px;background:#DDFBEA;top:52%;left:-90px}

/* ===== 布局 ===== */
#app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{
  width:248px;flex:0 0 248px;padding:22px 16px 18px;
  background:linear-gradient(180deg,#FFFFFF 0%,#FFF6FB 100%);
  border-right:2px solid var(--line);
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:16px;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 4px}
.brand-badge{
  width:48px;height:48px;flex:0 0 48px;border-radius:16px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(140deg,#FFE0EC,#E3F3FF 55%,#FFF3D6);
  box-shadow:0 4px 0 rgba(190,170,210,.22);
}
.brand-text strong{display:block;font-size:17px;letter-spacing:.4px}
.brand-text span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.nav-btn{
  display:flex;align-items:center;gap:11px;min-height:52px;padding:0 13px;border-radius:16px;
  font-size:16px;font-weight:800;color:var(--ink2);letter-spacing:.3px;
  transition:transform .14s,background .18s,box-shadow .18s;text-align:left;
}
.nav-btn .nav-ic{font-size:21px;width:26px;text-align:center;flex:0 0 26px}
.nav-btn:hover{background:#FFF7FB;transform:translateX(2px)}
.nav-btn.on{background:#fff;box-shadow:var(--shadow);color:var(--ink)}
.nav-btn.on::before{
  content:"";width:5px;height:22px;border-radius:3px;margin-left:-8px;margin-right:3px;
  background:var(--accent,var(--pink));
}
.nav-btn[data-c="pink"]{--accent:var(--pink);--accent-l:var(--pink-l)}
.nav-btn[data-c="purple"]{--accent:var(--purple);--accent-l:var(--purple-l)}
.nav-btn[data-c="blue"]{--accent:var(--blue);--accent-l:var(--blue-l)}
.nav-btn[data-c="green"]{--accent:var(--green);--accent-l:var(--green-l)}
.nav-btn[data-c="yellow"]{--accent:var(--yellow);--accent-l:var(--yellow-l)}
.nav-btn.on{background:linear-gradient(100deg,#fff,var(--accent-l))}
.side-tip{
  margin-top:auto;background:#fff;border-radius:18px;padding:13px 14px;
  border:2px dashed #F3E3F7;font-size:11.5px;color:var(--muted);line-height:1.75;
}
.side-tip b{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px;letter-spacing:.4px}
.side-card{
  background:#fff;border-radius:20px;padding:15px 15px 13px;
  box-shadow:var(--shadow);border:2px solid #FDF2F8;
}
.side-stars{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink2);font-weight:700}
.side-stars span{font-size:24px}
.side-stars b{font-size:26px;color:#F09A2B;letter-spacing:.5px}
.side-hint{font-size:11.5px;color:var(--muted);margin-top:2px}
.side-bar{height:9px;border-radius:6px;background:#F3ECF7;margin-top:10px;overflow:hidden}
.side-bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--purple));transition:width .5s}
.side-hint2{font-size:11.5px;color:var(--muted);margin-top:7px}

.main{flex:1;min-width:0;padding:18px 26px 40px;max-width:1180px;margin:0 auto;width:100%}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border-radius:20px;box-shadow:var(--shadow-soft);border:2px solid #fff;margin-bottom:16px;
}
.topbar-title{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-title .t-ic{font-size:26px}
.topbar-title h1{font-size:20px;margin:0;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.topbar-actions{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.pill{
  display:flex;align-items:center;gap:6px;height:42px;padding:0 15px;border-radius:14px;
  background:var(--yellow-l);font-weight:900;font-size:16px;color:#C88418;
}
.pill b{font-size:19px;color:#E08E00}
.icon-btn{
  width:44px;height:44px;border-radius:14px;background:#fff;border:2px solid var(--line);
  font-size:20px;display:grid;place-items:center;transition:transform .12s;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn.off{opacity:.45}

/* ===== 通用 ===== */
.view{display:none}
.view.active{display:block;animation:pop .28s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.seg{display:inline-flex;background:#fff;border-radius:17px;padding:5px;gap:4px;box-shadow:var(--shadow-soft);margin-bottom:14px;flex-wrap:wrap}
.seg button{
  min-height:44px;padding:0 18px;border-radius:13px;font-size:15px;font-weight:800;color:var(--ink2);
  transition:background .18s,color .18s,box-shadow .18s;
}
.seg button.on{background:linear-gradient(135deg,var(--purple),#9F86E8);color:#fff;box-shadow:0 3px 0 rgba(140,110,200,.35)}
.panel{background:var(--card);border-radius:var(--r);padding:18px 18px 22px;box-shadow:var(--shadow);border:2px solid #fff}
.lead{margin:0 0 14px;font-size:15px;color:var(--ink2);font-weight:600;line-height:1.6}
.h3{margin:0 0 14px;font-size:17px;letter-spacing:.5px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{
  min-height:48px;padding:0 22px;border-radius:16px;font-size:16px;font-weight:800;letter-spacing:.4px;
  background:linear-gradient(135deg,var(--blue),#5AB7EE);color:#fff;
  box-shadow:0 4px 0 rgba(70,150,200,.30);transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(70,150,200,.30)}
.btn.pink{background:linear-gradient(135deg,var(--pink),#FF7BA0);box-shadow:0 4px 0 rgba(220,110,150,.30)}
.btn.green{background:linear-gradient(135deg,var(--green),#5FD289);box-shadow:0 4px 0 rgba(70,180,120,.30)}
.btn.purple{background:linear-gradient(135deg,var(--purple),#A98CF2);box-shadow:0 4px 0 rgba(140,110,200,.30)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:0 3px 0 rgba(196,176,214,.18)}
.btn.danger{color:#D9577E;border-color:#FFD9E4}
.btn.sm{min-height:44px;padding:0 16px;font-size:14.5px}

/* ===== 字母卡片 ===== */
.letter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:13px}
.lcard{
  position:relative;padding:14px 8px 12px;border-radius:20px;background:#fff;
  border:2.5px solid var(--lc,var(--line));box-shadow:0 4px 0 rgba(200,180,215,.18);
  display:flex;flex-direction:column;align-items:center;gap:5px;min-height:132px;
  transition:transform .13s,box-shadow .13s;
}
.lcard:active{transform:translateY(3px) scale(.975);box-shadow:0 1px 0 rgba(200,180,215,.18)}
.lcard .lc-aa{font-size:29px;font-weight:900;letter-spacing:1px;line-height:1;color:var(--lc-ink,#5B4A6B)}
.lcard .lc-aa em{font-size:21px;font-style:normal;opacity:.62;margin-left:3px}
.lcard .lc-emoji{font-size:26px;line-height:1}
.lcard .lc-word{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.lcard.speaking{animation:bounce .45s}
@keyframes bounce{0%,100%{transform:none}30%{transform:translateY(-7px) scale(1.05)}60%{transform:translateY(0) scale(.98)}}

/* 配对游戏 */
.pair-progress{font-size:14px;font-weight:800;color:var(--muted);margin:4px 0 14px}
.pair-progress b{color:#E08E00;font-size:17px}
.pair-board{display:flex;flex-direction:column;gap:16px}
.pair-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:11px}
.pcard{
  min-height:76px;border-radius:18px;background:var(--pl,#EFF6FF);border:2.5px solid #fff;
  font-size:32px;font-weight:900;color:var(--pc,#4B3A5C);display:grid;place-items:center;
  box-shadow:0 4px 0 rgba(200,180,215,.16);transition:transform .12s,opacity .3s,background .2s;
}
.pcard:active{transform:scale(.96)}
.pcard.sel{outline:4px solid var(--pc,#7A5FA8);outline-offset:1px;transform:translateY(-3px)}
.pcard.matched{opacity:.32;pointer-events:none;background:#EFFBF3;color:#9BC9AB;box-shadow:none}
.pcard.bad{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

/* ===== 古诗 ===== */
.poem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:13px}
.poem-item{
  text-align:left;padding:16px 15px;border-radius:20px;background:#fff;
  border:2.5px solid var(--pc,var(--line));box-shadow:0 4px 0 rgba(200,180,215,.16);
  transition:transform .13s;display:flex;flex-direction:column;gap:6px;min-height:112px;
}
.poem-item:active{transform:translateY(3px) scale(.985)}
.poem-item .pi-ic{font-size:22px}
.poem-item .pi-title{font-size:18px;font-weight:900;letter-spacing:1px}
.poem-item .pi-author{font-size:12px;color:var(--muted);font-weight:700}
.poem-item .pi-hint{font-size:12.5px;color:var(--ink2);opacity:.85;line-height:1.5}
.poem-card{background:#fff;border-radius:24px;padding:22px 20px 24px;box-shadow:var(--shadow);border:2px solid #fff;margin-top:14px}
.poem-head{text-align:center;margin-bottom:16px}
.poem-head h2{margin:0;font-size:24px;letter-spacing:4px}
.poem-head p{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:1px}
.poem-body{display:flex;flex-direction:column;gap:10px;align-items:center;margin:6px 0 18px}
.poem-line{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;column-gap:1px;
  padding:5px 10px;border-radius:14px;transition:background .2s;cursor:pointer;
}
.poem-line:hover{background:#FFF6FB}
.pchar{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;padding:0 3px}
.pchar .py{
  font-style:normal;font-size:11.5px;height:15px;line-height:15px;
  color:#B49CC4;font-weight:600;white-space:nowrap;letter-spacing:0;
}
.pchar .hz{font-size:27px;font-weight:600;letter-spacing:0;color:var(--ink)}
.pchar.punct .hz{color:#CDBBD9}
.poem-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.poem-note{margin-top:16px;background:var(--purple-l);border-radius:16px;padding:12px 14px;font-size:13px;color:#6C5A82;line-height:1.7}
.poem-note b{color:#8B6BC0}

/* ===== 数字 ===== */
.num-stage{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:linear-gradient(150deg,#EAF7FF,#FFF0F7 60%,#FFF8E3);
  border-radius:22px;padding:18px 14px 16px;margin-bottom:16px;min-height:170px;justify-content:center;
}
.num-stage .n-big{font-size:76px;font-weight:900;line-height:1;letter-spacing:2px;color:#4A7FB5}
.num-stage .n-cn{font-size:19px;font-weight:800;color:#7B6A8D;letter-spacing:3px}
.num-stage .n-en{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:1px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:320px;margin-top:6px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--pink);display:block}
.dots i:nth-child(3n+2){background:var(--blue)}
.dots i:nth-child(3n+3){background:var(--yellow)}
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.ncard{
  min-height:76px;border-radius:18px;background:#fff;border:2.5px solid var(--nc,#EAF2FA);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 4px 0 rgba(200,180,215,.15);transition:transform .12s;
}
.ncard:active{transform:translateY(3px) scale(.97)}
.ncard b{font-size:26px;font-weight:900;color:#4A7FB5}
.ncard span{font-size:11px;color:var(--muted);font-weight:700}

/* ===== 出题区 ===== */
.quiz-wrap{background:#fff;border-radius:24px;padding:20px 18px 22px;box-shadow:var(--shadow);border:2px solid #fff;min-height:330px}
.q-head{font-size:17px;font-weight:800;color:var(--ink2);line-height:1.6;margin-bottom:14px;letter-spacing:.4px}
.q-head em{font-style:normal;color:#E0678F}
.q-body{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;min-height:96px}
.eq{display:flex;align-items:center;gap:10px;font-size:44px;font-weight:900;letter-spacing:1px;flex-wrap:wrap;justify-content:center}
.eq span{color:#4A7FB5}
.eq em{font-style:normal;color:#B49CC4;font-size:34px}
.eq .qmark{color:#E0678F;background:#FFEFF5;border-radius:14px;padding:0 14px;min-width:66px;text-align:center}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px}
.opt{
  min-height:82px;border-radius:20px;background:var(--oc,#F5F0FF);border:2.5px solid #fff;
  font-size:30px;font-weight:900;color:var(--oc-ink,#5B4A6B);display:grid;place-items:center;
  box-shadow:0 4px 0 rgba(200,180,215,.18);transition:transform .12s,background .2s,opacity .2s;
  padding:6px;
}
.opt:active{transform:translateY(3px) scale(.98)}
.opt.ok{background:#DDF8E7!important;color:#2E9C63!important;border-color:#8FE2B0;animation:bounce .45s}
.opt.bad{background:#FFE7EE!important;color:#D9577E!important;animation:shake .4s}
.opt:disabled{cursor:default}
.opt .opt-txt{font-size:17px;font-weight:800}
.q-foot{margin-top:16px;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.q-msg{font-size:16px;font-weight:800;color:#2E9C63;display:flex;align-items:center;gap:7px}
.q-msg.no{color:#D9577E}
.pattern-row{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap}
.pattern-cell{
  width:70px;height:70px;border-radius:18px;background:#F8F3FF;display:grid;place-items:center;
  font-size:34px;border:2.5px dashed #E4D6F3;
}
.pattern-cell.filled{background:#fff;border-style:solid;border-color:#F1E5F3;box-shadow:0 3px 0 rgba(200,180,215,.16)}
.pattern-cell.blank{background:#FFF3F8;border-color:#FFC7DC;color:#E0678F;font-size:30px;font-weight:900}
.shape-set{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}
.shape-big{width:96px;height:96px;display:grid;place-items:center;background:#FBF6FF;border-radius:22px}
.shape-svg{display:block}
.count-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px;max-width:420px;
  background:#FFFBF2;border-radius:18px;padding:14px;justify-items:center;
}
.count-grid span{font-size:28px;line-height:1.15}
.streak-bar{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted)}
.streak-bar b{color:#E08E00;font-size:15px}

/* ===== 闯关 ===== */
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:13px}
.level{
  position:relative;min-height:110px;border-radius:22px;padding:12px 8px 10px;
  background:#fff;border:2.5px solid var(--lc,#EFE4F6);box-shadow:0 4px 0 rgba(200,180,215,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:transform .13s;
}
.level:active{transform:translateY(3px) scale(.98)}
.level .lv-no{font-size:30px;font-weight:900;color:var(--lc-ink,#6E5C80);line-height:1}
.level .lv-stars{font-size:15px;letter-spacing:1.5px;color:#FFC94D}
.level .lv-stars i{font-style:normal;color:#E7DCF0}
.level .lv-tag{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.level.locked{background:#F9F6FB;border-color:#EFE9F4;box-shadow:none}
.level.locked .lv-no{color:#CBBBDA}
.level .lv-lock{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;background:rgba(249,246,251,.94);border-radius:19px}
.level.done{border-color:#9FE8BC;background:linear-gradient(160deg,#F4FFF8,#fff)}

.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.badge{
  background:#FAF7FD;border-radius:20px;padding:14px 10px;text-align:center;border:2px solid #F3ECF9;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.badge .b-ic{font-size:30px;line-height:1;filter:saturate(.15);opacity:.42}
.badge .b-name{font-size:13.5px;font-weight:900;color:#A998B8}
.badge .b-desc{font-size:11px;color:#BFB0CC;line-height:1.45}
.badge.on{background:linear-gradient(160deg,#FFF8E9,#FFF1F7);border-color:#FFDFA0;box-shadow:0 4px 0 rgba(240,200,120,.28)}
.badge.on .b-ic{filter:none;opacity:1;animation:float 2.6s ease-in-out infinite}
.badge.on .b-name{color:#B4772A}
.badge.on .b-desc{color:#C09455}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.reset-panel{margin-top:16px;text-align:center;padding:16px}

/* 闯关浮层 */
.overlay{
  position:fixed;inset:0;z-index:60;background:rgba(75,58,92,.42);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.overlay-card{
  width:min(620px,100%);max-height:92vh;overflow-y:auto;background:#FFFDFB;border-radius:26px;
  padding:20px 18px 22px;box-shadow:0 24px 60px rgba(60,40,80,.28);animation:pop .26s ease-out;
}
.adv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.adv-top .adv-title{font-size:15px;font-weight:900;color:var(--ink2);letter-spacing:.5px}
.adv-dots{display:flex;gap:6px;margin-bottom:14px}
.adv-dots i{flex:1;height:9px;border-radius:5px;background:#F0E8F6}
.adv-dots i.on{background:linear-gradient(90deg,var(--yellow),var(--pink))}
.adv-dots i.cur{background:var(--purple);animation:pulse 1.4s infinite}

/* ================= 核心：状态 / 存储 ================= */
const STORE_KEY = 'baby_learn_v1';
const DEFAULT_STATE = {
  stars: 0,
  sound: true,
  levels: {},          // { "1": 3 } 每关获得星数
  badges: [],          // 已解锁徽章 id
  stats: { math:0, logic:0, count:0, pairs:0, poems:[], streak:0, streakBest:0 }
};
let S = loadState();

function loadState(){
  const base = JSON.parse(JSON.stringify(DEFAULT_STATE));
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return base;
    const s = JSON.parse(raw);
    return {
      ...base, ...s,
      levels: s.levels || {},
      badges: Array.isArray(s.badges) ? s.badges : [],
      stats: Object.assign(base.stats, s.stats || {})
    };
  }catch(e){ return base; }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
}

/* ================= 工具函数 ================= */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = arr => arr[rnd(0, arr.length - 1)];
function shuffle(a){ const r = a.slice(); for(let i=r.length-1;i>0;i--){ const j=rnd(0,i); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function uniqOpts(correct, pool, count, fmt){
  const set = [correct];
  let guard = 0;
  while(set.length < count && guard++ < 300){
    const v = pick(pool);
    if(!set.some(x => JSON.stringify(x) === JSON.stringify(v))) set.push(v);
  }
  return shuffle(set).map(v => ({ html: fmt(v), ok: JSON.stringify(v) === JSON.stringify(correct) }));
}

/* ================= 声音：语音朗读 ================= */
const synth = window.speechSynthesis || null;
let voiceList = [];
function refreshVoices(){ if(synth) voiceList = synth.getVoices() || []; }
if(synth){
  refreshVoices();
  synth.addEventListener('voiceschanged', refreshVoices);
}
function pickVoice(lang){
  if(!voiceList.length) return null;
  const pre = lang.slice(0,2).toLowerCase();
  return voiceList.find(v => v.lang && v.lang.toLowerCase().startsWith(pre))
      || voiceList.find(v => v.lang && v.lang.toLowerCase().indexOf(pre) > -1)
      || null;
}
function speak(text, lang='zh-CN', rate=0.9){
  if(!S.sound || !synth || !text) return;
  try{
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = rate;
    u.pitch = 1.15;
    const v = pickVoice(lang);
    if(v) u.voice = v;
    synth.speak(u);
  }catch(e){}
}

/* ================= 声音：音效 ================= */
let actx = null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  }
  if(actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type='sine', delay=0, vol=0.16){
  if(!S.sound) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
const sfx = {
  tap(){ tone(660, 0.09, 'sine', 0, 0.10); },
  ok(){ tone(880, 0.13, 'sine', 0, 0.14); tone(1320, 0.16, 'sine', 0.10, 0.12); },
  no(){ tone(220, 0.16, 'triangle', 0, 0.10); tone(180, 0.2, 'triangle', 0.12, 0.08); },
  reward(){ [523,659,784,1046].forEach((f,i)=>tone(f, 0.22, 'sine', i*0.1, 0.13)); },
  badge(){ [784,988,1175,1568].forEach((f,i)=>tone(f, 0.26, 'triangle', i*0.11, 0.10)); }
};

function confetti(n=34){
  const box = $('#confetti');
  const colors = ['#FF93B3','#74C7F5','#FFD259','#7FDFA0','#BFA4F7','#FFB07A'];
  for(let i=0;i<n;i++){
    const p = document.createElement('i');
    p.style.left = rnd(0,100) + 'vw';
    p.style.top = '0';
    p.style.background = pick(colors);
    p.style.animationDuration = (1.6 + Math.random()*1.4).toFixed(2) + 's';
    p.style.animationDelay = (Math.random()*0.35).toFixed(2) + 's';
    p.style.width = rnd(7,12) + 'px';
    p.style.height = rnd(10,17) + 'px';
    box.appendChild(p);
    setTimeout(()=>p.remove(), 3400);
  }
}

/* ================= 星星 / 徽章 ================= */
function addStar(n=1){
  S.stars = Math.max(0, S.stars + n);
  save(); renderStars();
}
function renderStars(){
  const roundStar = Math.min(S.stars, 100);
  $('#starSide').textContent = S.stars;
  $('#starTop').textContent = S.stars;
  const adv = $('#starAdv'); if(adv) adv.textContent = S.stars;
  $('#sideBar').style.width = (roundStar / 100 * 100) + '%';
  const cleared = Object.values(S.levels).filter(v => v >= 1).length;
  const cc = $('#clearCount'); if(cc) cc.textContent = cleared;
  $('#badgeCount').textContent = `徽章 ${S.badges.length} / ${BADGES.length}`;
}
function checkBadges(silent=false){
  const fresh = [];
  BADGES.forEach(b=>{
    if(!S.badges.includes(b.id)){
      let ok = false;
      try{ ok = b.test(S); }catch(e){ ok = false; }
      if(ok){ S.badges.push(b.id); fresh.push(b); }
    }
  });
  if(fresh.length){
    save(); renderStars(); renderBadges();
    const b = fresh[0];
    toast(`${b.ic} 解锁徽章：${b.name}`);
    sfx.badge(); confetti(26);
  }
  return fresh;
}

/* ================= 通用答题渲染 ================= */
function renderQuestion(host, q, opts = {}){
  const { onCorrect, onWrong, onNext, nextLabel = '下一题 →' } = opts;
  host.innerHTML = `
    <div class="q-head">${q.prompt}</div>
    ${q.body ? `<div class="q-body">${q.body}</div>` : ''}
    <div class="opt-grid"></div>
    <div class="q-foot"><div class="q-msg" style="visibility:hidden">&nbsp;</div><div class="foot-right"></div></div>`;
  const grid = host.querySelector('.opt-grid');
  const msg = host.querySelector('.q-msg');
  const footRight = host.querySelector('.foot-right');
  let locked = false;

  q.options.forEach((o, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    const col = OPT_COLORS[i % OPT_COLORS.length];
    b.style.setProperty('--oc', col.bg);
    b.style.setProperty('--oc-ink', col.ink);
    b.innerHTML = o.html;
    b.addEventListener('click', ()=>{
      if(locked) return;
      if(o.ok){
        locked = true;
        b.classList.add('ok');
        $$('.opt', grid).forEach(x => x.disabled = true);
        msg.style.visibility = 'visible';
        msg.className = 'q-msg';
        msg.textContent = '✅ ' + pick(PRAISE);
        sfx.ok();
        if(!q._rewarded){
          q._rewarded = true;
          S.stats.streak += 1;
          S.stats.streakBest = Math.max(S.stats.streakBest, S.stats.streak);
          addStar(1);
        }
        if(onCorrect) onCorrect(q);
        checkBadges();
        if(onNext){
          const nb = document.createElement('button');
          nb.className = 'btn green';
          nb.textContent = nextLabel;
          nb.addEventListener('click', ()=>{ sfx.tap(); onNext(); });
          footRight.innerHTML = '';
          footRight.appendChild(nb);
        }
      }else{
        q.tries = (q.tries || 0) + 1;
        S.stats.streak = 0;
        b.classList.add('bad');
        b.disabled = true;
        msg.style.visibility = 'visible';
        msg.className = 'q-msg no';
        msg.textContent = '💡 ' + pick(CHEER);
        sfx.no();
        if(onWrong) onWrong(q);
      }
    });
    grid.appendChild(b);
  });
  return host;
}

const pairState = { letters: [], sel: null, matched: 0 };

function newPairRound(){
  const chosen = shuffle(LETTERS).slice(0, 5);
  pairState.letters = chosen;
  pairState.sel = null;
  pairState.matched = 0;
  $('#pairDone').textContent = '0';
  $('#pairTotal').textContent = chosen.length;

  const cell = (l, kind) => `<button class="pcard" data-kind="${kind}" data-u="${l.u}"
      style="--pl:${l.color.l};--pc:${l.color.ink}">${kind === 'u' ? l.u : l.lower}</button>`;
  $('#pairUpper').innerHTML = shuffle(chosen).map(l => cell(l, 'u')).join('');
  $('#pairLower').innerHTML = shuffle(chosen).map(l => cell(l, 'l')).join('');
}

function bindPairGame(){
  const board = $('#tab-letters-pair');
  board.addEventListener('click', e=>{
    const card = e.target.closest('.pcard');
    if(!card) return;
    const kind = card.dataset.kind;
    const u = card.dataset.u;
    const data = LETTERS.find(l => l.u === u);
    sfx.tap();

    if(kind === 'u'){
      $$('.pcard', $('#pairUpper')).forEach(c => c.classList.remove('sel'));
      card.classList.add('sel');
      pairState.sel = u;
      speak(`${data.u}`, 'en-US', 0.8);
      return;
    }

    // 点小写
    if(!pairState.sel){
      toast('先点上面的大写字母哦 👆');
      speak(`${data.lower}`, 'en-US', 0.8);
      return;
    }
    if(pairState.sel === u){
      const upCard = $(`.pcard[data-kind="u"][data-u="${u}"]`, $('#pairUpper'));
      upCard.classList.add('matched');
      upCard.classList.remove('sel');
      card.classList.add('matched');
      pairState.sel = null;
      pairState.matched += 1;
      $('#pairDone').textContent = pairState.matched;
      speak(`${data.u}, ${data.lower}`, 'en-US', 0.75);
      sfx.ok();
      addStar(1);

      if(pairState.matched === pairState.letters.length){
        S.stats.pairs += 1;
        addStar(3);
        save();
        toast('🎉 全部配对成功！额外奖励 3 颗星');
        confetti(40);
        checkBadges();
        setTimeout(newPairRound, 1500);
      }
    }else{
      card.classList.add('bad');
      const upCard = $(`.pcard[data-kind="u"][data-u="${pairState.sel}"]`, $('#pairUpper'));
      if(upCard) upCard.classList.add('bad');
      sfx.no();
      toast('不是这个哦，再找找看～');
      pairState.sel = null;
      setTimeout(()=>{
        card.classList.remove('bad');
        if(upCard) upCard.classList.remove('bad');
        $$('.pcard', $('#pairUpper')).forEach(c => c.classList.remove('sel'));
      }, 520);
    }
  });

  $('#pairNew').addEventListener('click', ()=>{ newPairRound(); sfx.tap(); });
}

function pinyinLine(line){
  const py = line.p.trim().split(/\s+/);
  let idx = 0;
  return Array.from(line.t).map(ch=>{
    if(/[\u4e00-\u9fa5]/.test(ch)){
      return `<span class="pchar"><i class="py">${py[idx++] || ''}</i><span class="hz">${ch}</span></span>`;
    }
    if(/[，。！？；、：]/.test(ch)){
      return `<span class="pchar punct"><i class="py"></i><span class="hz">${ch}</span></span>`;
    }
    return `<span class="pchar"><i class="py"></i><span class="hz">${ch}</span></span>`;
  }).join('');
}

function numOptions(ans, min, max, count=4){
  const cand = [ans];
  [-1, 1, -2, 2, -3, 3].forEach(d=>{
    const v = ans + d;
    if(v >= min && v <= max && !cand.includes(v) && cand.length < count) cand.push(v);
  });
  let guard = 0;
  while(cand.length < count && guard++ < 100){
    const v = rnd(min, max);
    if(!cand.includes(v)) cand.push(v);
  }
  return shuffle(cand).map(v => ({ html: `<span>${v}</span>`, ok: v === ans }));
}

function emoGroup(n, emo, dim){
  if(n <= 0) return '';
  return `<span style="${dim ? 'opacity:.28' : ''}">${emo.repeat(n)}</span>`;
}

function mathQuestion(max = 10){
  const isAdd = Math.random() < 0.58;
  let a, b, ans, op, mark;
  if(isAdd){
    a = rnd(0, max); b = rnd(0, max - a); ans = a + b; op = '+';
  }else{
    a = rnd(1, max); b = rnd(0, a); ans = a - b; op = '−';
  }
  const emo = pick(['🍎','🍓','🎈','⭐','🐟','🍪']);
  const hint = isAdd
    ? ` ${emoGroup(a, emo)} <b style="color:#C0A8D0">+</b> ${emoGroup(b, emo)} `
    : ` ${emoGroup(ans, emo)}${emoGroup(b, emo, true)} `;
  const body = `
    <div class="eq"><span>${a}</span><em>${op}</em><span>${b}</span><em>=</em><span class="qmark">?</span></div>
    <div style="width:100%;text-align:center;font-size:19px;letter-spacing:2px;margin-top:10px;line-height:1.7;word-break:break-all">${hint}</div>`;
  return {
    prompt: isAdd ? '算一算，一共有几个？' : '算一算，还剩下几个？',
    body,
    options: numOptions(ans, 0, max, 4),
    ans
  };
}

const calcState = { q: null };
function nextCalc(){
  const q = mathQuestion(10);
  calcState.q = q;
  renderQuestion($('#calcWrap'), q, {
    onCorrect(){ S.stats.math += 1; save(); },
    onNext: nextCalc
  });
}

const countState = { q: null };
function countQuestion(){
  const n = rnd(1, 10);
  const emo = pick(['🍓','🐥','🎈','⭐','🐞','🍪','🌸','🚗','🐠']);
  const items = Array.from({length:n}, ()=>`<span>${emo}</span>`).join('');
  return {
    prompt: `数一数，一共有几个 ${emo} ？`,
    body: `<div class="count-grid">${items}</div>`,
    options: numOptions(n, 0, 10, 4),
    n
  };
}
function nextCount(){
  const q = countQuestion();
  countState.q = q;
  renderQuestion($('#countWrap'), q, {
    onCorrect(){ S.stats.count += 1; save(); },
    onNext: nextCount
  });
}

function initNumbers(){
  renderNumGrid();
  renderNumStage(3);
}
/* ================= 模块四：逻辑挑战 ================= */
const EMO_POOL = ['🍎','🍌','🍇','🍓','🐱','🐶','⭐','🌙','🚗','🌸','🎈','🐟','🐰','🦋','🍩','🧸'];
const SHAPES = ['circle','square','triangle','star','heart','diamond'];
const SHAPE_COLORS = ['#FF93B3','#74C7F5','#FFD259','#7FDFA0','#BFA4F7','#FFAB76'];

function shapeSVG(shape, color, size = 54){
  let inner = '';
  switch(shape){
    case 'circle':   inner = `<circle cx="30" cy="30" r="24" fill="${color}"/>`; break;
    case 'square':   inner = `<rect x="8" y="8" width="44" height="44" rx="8" fill="${color}"/>`; break;
    case 'triangle': inner = `<polygon points="30,5 56,54 4,54" fill="${color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/>`; break;
    case 'star':     inner = `<polygon points="30,4 37.5,22 57,23 42,35.5 47,55 30,44 13,55 18,35.5 3,23 22.5,22" fill="${color}" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`; break;
    case 'heart':    inner = `<path d="M30 55C10 40 5 30 5 21a13 13 0 0 1 25-7 13 13 0 0 1 25 7c0 9-5 19-25 34z" fill="${color}"/>`; break;
    case 'diamond':  inner = `<polygon points="30,4 56,30 30,56 4,30" fill="${color}" stroke="${color}" stroke-width="4" stroke-linejoin="round"/>`; break;
  }
  return `<svg class="shape-svg" viewBox="0 0 60 60" width="${size}" height="${size}" aria-hidden="true">${inner}</svg>`;
}

function patternQuestion(){
  const set = shuffle(EMO_POOL).slice(0, 3);
  const kind = pick(['ab', 'abc', 'aab']);
  let seq;
  if(kind === 'ab')  seq = [set[0], set[1], set[0], set[1], set[0]];
  if(kind === 'abc') seq = [set[0], set[1], set[2], set[0], set[1]];
  if(kind === 'aab') seq = [set[0], set[0], set[1], set[0], set[0]];
  const given = seq.slice(0, 4);
  const answer = seq[4];

  const cells = given.map(e => `<div class="pattern-cell filled">${e}</div>`).join('')
    + `<div class="pattern-cell blank">?</div>`;

  const others = shuffle(EMO_POOL.filter(e => !given.includes(e))).slice(0, 3);
  const options = shuffle([answer, ...others]).map(e => ({
    html: `<span style="font-size:38px">${e}</span>`, ok: e === answer
  }));

  return {
    prompt: '找规律：最后一格应该是什么呢？',
    body: `<div class="pattern-row">${cells}</div>`,
    options
  };
}

function shapeQuestion(){
  const shape = pick(SHAPES);
  const color = pick(SHAPE_COLORS);
  const otherShape = pick(SHAPES.filter(s => s !== shape));
  const otherColor = pick(SHAPE_COLORS.filter(c => c !== color));

  const combos = [
    {shape, color},                        // 正确
    {shape, color: otherColor},            // 同形异色
    {shape: otherShape, color},            // 异形同色
    {shape: otherShape, color: otherColor} // 异形异色
  ];
  const options = shuffle(combos).map(c => ({
    html: shapeSVG(c.shape, c.color, 54),
    ok: c.shape === shape && c.color === color
  }));

  return {
    prompt: '找一找：哪个和左边一模一样？',
    body: `<div class="shape-set"><div class="shape-big">${shapeSVG(shape, color, 78)}</div></div>`,
    options
  };
}

function compareQuestion(){
  const kind = pick(['max', 'min', 'most', 'size']);

  if(kind === 'max' || kind === 'min'){
    const nums = shuffle(Array.from({length:10}, (_, i)=>i + 1)).slice(0, 3);
    const target = kind === 'max' ? Math.max(...nums) : Math.min(...nums);
    return {
      prompt: kind === 'max' ? '哪个数字最大？' : '哪个数字最小？',
      body: '',
      options: shuffle(nums).map(v => ({ html: `<span>${v}</span>`, ok: v === target }))
    };
  }

  if(kind === 'most'){
    const emo = pick(['🍓','🎈','🐥','⭐','🍪','🐞']);
    const counts = shuffle([2,3,4,5,6,7]).slice(0, 3);
    const target = Math.max(...counts);
    return {
      prompt: '哪一组最多？',
      body: '',
      options: shuffle(counts).map(n => ({
        html: `<span style="font-size:20px;letter-spacing:1px;line-height:1.5;word-break:break-all">${emo.repeat(n)}</span>`,
        ok: n === target
      }))
    };
  }

  const emo = pick(['🐘','🚗','🎈','🌳','🐳','🍎']);
  const sizes = [54, 38, 26];
  return {
    prompt: '哪个最大？',
    body: '',
    options: shuffle(sizes).map(s => ({
      html: `<span style="font-size:${s}px;line-height:1.2">${emo}</span>`,
      ok: s === 54
    }))
  };
}

const logicState = { q: null };
function nextLogic(){
  const makers = [patternQuestion, shapeQuestion, compareQuestion];
  const q = pick(makers)();
  logicState.q = q;
  renderQuestion($('#logicWrap'), q, {
    onCorrect(){ S.stats.logic += 1; save(); },
    onNext: nextLogic
  });
}
/* ================= 模块五：闯关冒险 ================= */
const advState = { level: 0, idx: 0, correct: 0, total: 5, queue: [] };

function letterQuestion(){
  const l = pick(LETTERS);
  const dir = Math.random() < 0.5 ? 'u2l' : 'l2u';
  const opts = shuffle([l, ...shuffle(LETTERS.filter(x => x.u !== l.u)).slice(0, 3)]);
  const c = l.color;
  return {
    prompt: dir === 'u2l'
      ? `大写字母 <em>${l.u}</em> 的小写是哪一个？`
      : `小写字母 <em>${l.lower}</em> 的大写是哪一个？`,
    body: `<div style="font-size:56px;font-weight:900;line-height:1.1;color:${c.ink};background:${c.l};border-radius:20px;padding:6px 30px">${dir === 'u2l' ? l.u : l.lower}</div>`,
    options: opts.map(x => ({
      html: `<span>${dir === 'u2l' ? x.lower : x.u}</span>`,
      ok: x.u === l.u
    }))
  };
}

function makeAdvQuestion(type, level){
  if(type === 'math')  return mathQuestion(level <= 3 ? 5 : 10);
  if(type === 'count') return countQuestion();
  if(type === 'letter') return letterQuestion();
  return pick([patternQuestion, shapeQuestion, compareQuestion])();
}

function renderLevels(){
  const grid = $('#levelGrid');
  if(!grid) return;
  grid.innerHTML = Array.from({length: TOTAL_LEVELS}, (_, i)=>{
    const n = i + 1;
    const got = S.levels[n] || 0;
    const unlocked = n === 1 || (S.levels[n - 1] || 0) >= 1;
    const c = CANDY[i % 5];
    const stars = [1,2,3].map(k => k <= got ? '★' : '<i>★</i>').join('');
    const inner = unlocked
      ? `<span class="lv-no">${n}</span>
         <span class="lv-stars">${stars}</span>
         <span class="lv-tag">${got === 3 ? '完美通关' : got ? '已过关' : '来挑战'}</span>`
      : `<span class="lv-lock">🔒</span>`;
    return `<button class="level ${unlocked ? '' : 'locked'} ${got ? 'done' : ''}" data-l="${n}"
        style="--lc:${unlocked ? c.c : '#EFE9F4'};--lc-ink:${unlocked ? c.ink : '#C6B8D3'}">
        ${inner}
      </button>`;
  }).join('');
  renderStars();
}

function renderBadges(){
  const box = $('#badgeGrid');
  if(!box) return;
  box.innerHTML = BADGES.map(b=>{
    const on = S.badges.includes(b.id);
    return `<div class="badge ${on ? 'on' : ''}">
        <span class="b-ic">${b.ic}</span>
        <span class="b-name">${b.name}</span>
        <span class="b-desc">${b.desc}</span>
      </div>`;
  }).join('');
}

function bindAdventure(){
  $('#levelGrid').addEventListener('click', e=>{
    const btn = e.target.closest('.level');
    if(!btn) return;
    const n = +btn.dataset.l;
    if(btn.classList.contains('locked')){
      toast(`先通过第 ${n - 1} 关才能解锁哦 🔒`);
      sfx.no();
      return;
    }
    sfx.tap();
    startLevel(n);
  });

  $('#resetBtn').addEventListener('click', ()=>{
    if(!window.confirm('确定要清空所有星星、关卡进度和徽章吗？此操作不可恢复。')) return;
    if(!window.confirm('真的确定吗？小朋友的进度会全部消失哦。')) return;
    S = JSON.parse(JSON.stringify(DEFAULT_STATE));
    save();
    renderStars(); renderLevels(); renderBadges();
    toast('进度已重置');
  });
}

function startLevel(n){
  advState.level = n;
  advState.idx = 0;
  advState.correct = 0;
  advState.total = 5;
  const pool = n <= 2
    ? ['math','letter','count','math','logic']
    : ['math','logic','letter','count','logic'];
  advState.queue = shuffle(pool);
  $('#advOverlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  renderAdvQuestion();
}

function closeAdv(){
  $('#advOverlay').classList.add('hidden');
  document.body.style.overflow = '';
  if(synth) synth.cancel();
}

function renderAdvQuestion(){
  const st = advState;
  if(st.idx >= st.total){ finishLevel(); return; }

  const dots = Array.from({length: st.total}, (_, i)=>
    `<i class="${i < st.idx ? 'on' : ''} ${i === st.idx ? 'cur' : ''}"></i>`).join('');

  $('#advCard').innerHTML = `
    <div class="adv-top">
      <div class="adv-title">第 ${st.level} 关 · 第 ${st.idx + 1} / ${st.total} 题</div>
      <button class="icon-btn" id="advClose" aria-label="关闭">✕</button>
    </div>
    <div class="adv-dots">${dots}</div>
    <div id="advQ"></div>`;
  $('#advClose').addEventListener('click', ()=>{ sfx.tap(); closeAdv(); });

  const q = makeAdvQuestion(st.queue[st.idx], st.level);
  renderQuestion($('#advQ'), q, {
    onCorrect(){ if(!q.tries) st.correct += 1; },
    onNext(){ st.idx += 1; renderAdvQuestion(); }
  });
}

function finishLevel(){
  const st = advState;
  // 首次就答对的题数决定星级；完成即至少 1 星，保证小朋友总有进展
  const stars = st.correct >= 5 ? 3 : st.correct >= 3 ? 2 : 1;
  const prev = S.levels[st.level] || 0;
  if(stars > prev) S.levels[st.level] = stars;
  const bonus = stars * 3;
  if(bonus) addStar(bonus);
  save();

  const title = stars === 3 ? '完美通关！' : stars === 2 ? '好棒呀！' : '过关啦！';
  const emoji = stars === 3 ? '🏆' : stars === 2 ? '🎉' : '👍';

  $('#advCard').innerHTML = `
    <div class="result-box">
      <div class="rb-emoji">${emoji}</div>
      <h2>${title}</h2>
      <div class="result-stars">${[1,2,3].map(k => k <= stars ? '★' : '<i>★</i>').join('')}</div>
      <div class="rb-sub">第一次就答对 ${st.correct} / ${st.total} 题${st.level < TOTAL_LEVELS ? `　·　第 ${st.level + 1} 关已解锁` : ''}</div>
      <div class="result-reward">⭐ 星星奖励 +${bonus}</div>
      ${stars < 3 ? `<div class="rb-sub" style="margin-top:10px">再玩一次，争取三颗星 🌟</div>` : ''}
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap">
        <button class="btn green" id="advAgain">再玩一次</button>
        <button class="btn ghost" id="advBack">返回关卡图</button>
      </div>
    </div>`;

  sfx.reward(); confetti(stars === 3 ? 60 : 34);

  $('#advAgain').addEventListener('click', ()=>{ sfx.tap(); startLevel(st.level); });
  $('#advBack').addEventListener('click', ()=>{ sfx.tap(); closeAdv(); renderLevels(); });

  renderLevels();
  checkBadges();
}
/* ================= 初始化 ================= */
function init(){
  renderStars();
  renderLetters();
  renderPoemGrid();
  initNumbers();
  renderLevels();
  renderBadges();

  bindNav();
  bindSegs();
  bindPairGame();
  bindPoemBack();
  bindAdventure();

  $('#soundBtn').textContent = S.sound ? '🔊' : '🔇';
  $('#soundBtn').classList.toggle('off', !S.sound);

  // 首次触摸/点击时唤醒音频与语音引擎（浏览器策略要求）
  const warm = ()=>{ ensureAudio(); refreshVoices(); document.removeEventListener('pointerdown', warm); };
  document.addEventListener('pointerdown', warm, {once:true});

  // 打开时静默补齐历史成就
  BADGES.forEach(b=>{
    if(!S.badges.includes(b.id)){
      try{ if(b.test(S)) S.badges.push(b.id); }catch(e){}
    }
  });
  save();
  renderBadges();
  renderStars();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
</script>
</body>
</html>
